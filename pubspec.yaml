name: archery_helper
description: "Schießzeit-Ampel und Wettkampf-Uhr für den Bogensport — tastaturbedienter Kiosk-Bildschirm für den Schießstand."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  window_manager: ^0.5.2
  audioplayers: ^6.7.1
  clock: ^1.1.2
  path: ^1.9.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Erzeugt von tool/generate_signal_sounds.dart. Beide Ordner einzeln, denn
    # eine Verzeichnisangabe nimmt nur die Dateien darin und keine Unterordner.
    - assets/sounds/tone1/
    - assets/sounds/tone2/
